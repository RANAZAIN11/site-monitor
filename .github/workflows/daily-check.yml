name: Daily site morning check

on:
  schedule:
    # 10:00 AM Pakistan (PKT = UTC+5)  ->  05:00 UTC
    # Note: GitHub's scheduler can run a few minutes late under load.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

# Needed so the run can commit the diff-state snapshot back to the repo.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Run morning check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          STORE_PUBLIC_URL: https://www.sahibas.com
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}   # optional — code falls back to rz1753431@gmail.com
          ESCALATE_SEV: "HIGH,MED"                    # which carried-over severities email the admin
        run: npm run check

      # Save today's issue snapshot so tomorrow's run can diff against it.
      # if: always() -> state is committed even if the email step above failed
      # (the snapshot is written to disk before any email is sent).
      - name: Persist diff state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "site-monitor-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore(state): daily diff snapshot [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
